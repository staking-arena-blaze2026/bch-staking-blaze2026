name: Frontend
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix ..
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
      # Builds offline and configured production assets; all API data is intercepted.
      - run: npm run test:static
      - run: npm run test:static:browser
      - run: npm run test:electrum
      - run: npm run test:queue:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: |
            frontend/test-results/
            frontend/browser-diagnostics/
          retention-days: 7
